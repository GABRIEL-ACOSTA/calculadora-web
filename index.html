<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculadora web desarrollada con HTML, CSS y JavaScript.">
  <title>Calculadora Web</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #eef2ff);
      color: #172033;
    }
    .calculator {
      width: min(100%, 360px);
      padding: 22px;
      border-radius: 24px;
      background: #182235;
      box-shadow: 0 18px 45px rgba(20, 32, 53, .25);
    }
    h1 {
      margin: 0 0 16px;
      color: #fff;
      text-align: center;
      font-size: 1.35rem;
    }
    .screen {
      min-height: 105px;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 14px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    #operation {
      min-height: 22px;
      color: #64748b;
      text-align: right;
      overflow-wrap: anywhere;
      font-size: .95rem;
    }
    #result {
      color: #0f172a;
      text-align: right;
      font-size: 2rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      min-height: 58px;
      border: 0;
      border-radius: 13px;
      background: #e2e8f0;
      color: #172033;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .12s, filter .12s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(.96); }
    .operator { background: #bfdbfe; color: #1d4ed8; }
    .utility { background: #cbd5e1; }
    .equals {
      grid-row: span 2;
      background: #16a34a;
      color: white;
    }
    .zero { grid-column: span 2; }
    .hint {
      margin: 15px 0 0;
      color: #cbd5e1;
      text-align: center;
      font-size: .78rem;
    }
    @media (max-width: 380px) {
      .calculator { padding: 16px; }
      button { min-height: 54px; }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Calculadora Web</h1>

    <section class="screen" aria-live="polite">
      <div id="operation">Listo para calcular</div>
      <div id="result">0</div>
    </section>

    <section class="keys" aria-label="Teclado de la calculadora">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="delete">DEL</button>
      <button class="operator" data-value="%">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="utility" data-action="sign">+/−</button>
      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="calculate">=</button>
    </section>

    <p class="hint">También puedes usar el teclado de tu computadora.</p>
  </main>

  <script>
    const operationDisplay = document.getElementById("operation");
    const resultDisplay = document.getElementById("result");
    const keys = document.querySelector(".keys");

    let expression = "";
    let justCalculated = false;

    function updateScreen(message = "") {
      operationDisplay.textContent = message || expression || "Listo para calcular";
      resultDisplay.textContent = expression || "0";
    }

    function addValue(value) {
      const operators = ["+", "-", "*", "/", "%"];

      if (justCalculated && !operators.includes(value)) {
        expression = "";
      }
      justCalculated = false;

      if (value === ".") {
        const currentNumber = expression.split(/[+\-*/%]/).pop();
        if (currentNumber.includes(".")) return;
        if (currentNumber === "") value = "0.";
      }

      const last = expression.slice(-1);
      if (operators.includes(value) && operators.includes(last)) {
        expression = expression.slice(0, -1);
      }

      if (expression.length < 28) {
        expression += value;
        updateScreen();
      }
    }

    function calculate() {
      if (!expression) return;

      // Solo se aceptan números y operadores matemáticos básicos.
      if (!/^[0-9+\-*/%. ]+$/.test(expression)) {
        updateScreen("Expresión no válida");
        return;
      }

      try {
        const normalized = expression.replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");
        const answer = Function('"use strict"; return (' + normalized + ')')();

        if (!Number.isFinite(answer)) {
          updateScreen("No se puede dividir para cero");
          return;
        }

        const previous = expression;
        expression = String(Number(answer.toPrecision(12)));
        justCalculated = true;
        updateScreen(previous + " =");
      } catch (error) {
        updateScreen("Operación no válida");
      }
    }

    function clearAll() {
      expression = "";
      justCalculated = false;
      updateScreen("Calculadora reiniciada");
    }

    function deleteLast() {
      expression = expression.slice(0, -1);
      justCalculated = false;
      updateScreen();
    }

    function changeSign() {
      if (!expression) return;
      const match = expression.match(/(\d+\.?\d*)$/);
      if (!match) return;
      const number = match[0];
      const start = expression.length - number.length;
      const before = expression.slice(0, start);
      expression = before.endsWith("-")
        ? before.slice(0, -1) + number
        : before + "-" + number;
      updateScreen();
    }

    keys.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const action = button.dataset.action;
      if (action === "clear") clearAll();
      else if (action === "delete") deleteLast();
      else if (action === "calculate") calculate();
      else if (action === "sign") changeSign();
      else if (button.dataset.value) addValue(button.dataset.value);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9.+\-*/%]$/.test(event.key)) addValue(event.key);
      else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        calculate();
      } else if (event.key === "Backspace") deleteLast();
      else if (event.key === "Escape") clearAll();
    });

    updateScreen();
  </script>
</body>
</html>
